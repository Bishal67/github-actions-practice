# what is goal of your workflow
# Goal: Whenever someone changes the python code.the linter will check if the syntax , format ,indetation (linting correct or not )
name: Auto Linter

on: 
  push:
    paths: "*.py"

jobs:
   code:
    runs-on: ubuntu-latest
    # this step will automatically clone the code of the current branch into the runner
    steps:
      - name: Checkout/Clone the code
        uses: actions/checkout@v7

      - name: Install Linter
        run: pip install ruff

      - name: check the files for linting
        run: ruff check .
